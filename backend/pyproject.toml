[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) as a default argument is the documented, idiomatic
# pattern for dependency injection, not the mutable-default-argument bug B008
# is meant to catch.
"app/routers/*.py" = ["B008"]
